onboarding = false

# アクティブな行の背景色。デフォルトは藍色系(#1e1e2e)で識別しづらいため明るめのグレーに変更
[theme.custom]
active_row_bg = "#5c5c5c"

[keys]
# 公式ドキュメント注記: alt系のprefixは環境依存で不安定らしいので挙動が不安定ならctrl系に変更する
prefix = "alt+h"

# 設定リロード
reload_config = "prefix+ctrl+r"

# ペイン分割
split_vertical = "prefix+|"        # 左右
split_horizontal = "prefix+_"      # 上下

# ペインフォーカス移動
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# ペインリサイズ
resize_mode = "prefix+r"

# タブ(≒tmuxのwindow)切替
next_tab = "prefix+alt+j"
previous_tab = "prefix+alt+k"

# 新規タブ作成 / タブ名変更
new_tab = "prefix+n"
rename_tab = "prefix+shift+r"

# ワークスペース(≒tmuxのsession)一覧・切替
workspace_picker = "prefix+alt+s"

# workspace_pickerでサイドバーにフォーカスがある間の移動キー (navigate mode)。
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

# デタッチ / ワークスペース終了
detach = "prefix+ctrl+d"
close_workspace = "prefix+q"

# herdr標準の goto (デフォルト prefix+g、ワークスペース/タブのファジー検索)
goto = "prefix+f"

# 一時ペイン起動
# type="popup" だとポップアップ内のテキストをマウスで選択・コピーできない (herdr 0.9.3 時点) ため、
# 通常ペインと同じく選択できる type="pane" (ズーム表示の一時ペイン。コマンド終了で閉じる) を使う。
# herdrは [terminal] new_cwd (デフォルト "follow") で新規ペインが呼び出し元のcwdを継承する。
# gitui
[[keys.command]]
key = "prefix+g"
type = "pane"
command = "$SHELL -ic 'exec gitui'"

# 汎用の一時利用シェル
[[keys.command]]
key = "prefix+t"
type = "pane"
command = "$SHELL -i"

# nvim
[[keys.command]]
key = "prefix+v"
type = "pane"
command = "$SHELL -ic 'exec nvim'"

# エージェント一覧の表示
[ui.sidebar.agents]
rows = [["state_icon", "workspace", { token = "tab", fg = "#ffffff" }]]

# Claude Code / Codex は2行目に現在のタスク内容(terminal_title_stripped)を表示する
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", { token = "tab", fg = "#ffffff" }], [{ token = "terminal_title_stripped", fg = "#99ccff" }]]
codex = [["state_icon", "workspace", { token = "tab", fg = "#ffffff" }], [{ token = "terminal_title_stripped", fg = "#99ccff" }]]
